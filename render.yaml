services:
  - type: web
    name: screenshare-p2p
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CF_TURN_TOKEN_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
