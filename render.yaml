services:
  - type: web
    name: screenshare-p2p
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://screenshare-p2p.onrender.com,http://tauri.localhost,https://tauri.localhost,tauri://localhost
      - key: CF_TURN_TOKEN_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
