name: CI & Windows Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Forçar criação de release no GitHub Releases (mesmo sem tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test-and-build:
    name: Build & Package (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run WebRTC, Signaling & Bridge Tests
        run: npm test

      - name: Run Rust Audio & Window Tests (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri v2 Desktop Application
        shell: pwsh
        run: npx tauri build

      - name: Package Windows Bundle & Compute Checksums
        shell: pwsh
        run: |
          # 1. Garantir diretório de distribuição
          New-Item -ItemType Directory -Force -Path dist/StreamGrid | Out-Null

          # 2. Copiar executável compilado pelo Tauri v2
          $exe = if (Test-Path 'src-tauri/target/release/StreamGrid.exe') {
            'src-tauri/target/release/StreamGrid.exe'
          } else {
            'src-tauri/target/release/streamgrid.exe'
          }
          Copy-Item $exe -Destination dist/StreamGrid/StreamGrid.exe -Force

          # 3. Copiar instaladores gerados (NSIS / MSI), se presentes
          Get-ChildItem -Path src-tauri/target/release/bundle -Include *.exe, *.msi -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination dist/ -Force }

          # 4. Compactar o pacote portátil para distribuição
          Compress-Archive -Path dist/StreamGrid -DestinationPath dist/StreamGrid-Windows.zip -Force

          # 5. Gerar hash SHA-256 para integridade e auditoria
          $hash = (Get-FileHash -Path dist/StreamGrid-Windows.zip -Algorithm SHA256).Hash
          "$hash  StreamGrid-Windows.zip" | Out-File -FilePath dist/StreamGrid-Windows.zip.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        with:
          name: StreamGrid-Windows
          path: |
            dist/StreamGrid-Windows.zip
            dist/StreamGrid-Windows.zip.sha256
            dist/*.exe
            dist/*.msi
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Artifact Attestation (Provenance via Sigstore)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/StreamGrid-Windows.zip'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StreamGrid-Windows.zip
            dist/StreamGrid-Windows.zip.sha256
            dist/*.exe
            dist/*.msi
          generate_release_notes: true
          draft: false
          prerelease: false
