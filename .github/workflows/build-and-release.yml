name: CI & Windows Release Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Forçar criação de release no GitHub Releases (mesmo sem tag)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Package (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run WebRTC, Signaling & Bridge Tests
        run: npm test

      - name: Run Real Browser E2E Tests
        run: npm run test:e2e

      - name: Check Rust Formatting & Clippy Lints (src-tauri)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust Audio & Window Tests (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri v2 Desktop Application
        shell: pwsh
        run: npx tauri build

      - name: Package Windows Bundle & Compute Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. Garantir diretório de distribuição
          New-Item -ItemType Directory -Force -Path dist/StreamGrid | Out-Null

          # 2. Copiar executável compilado pelo Tauri v2
          $exe = if (Test-Path 'src-tauri/target/release/StreamGrid.exe') {
            'src-tauri/target/release/StreamGrid.exe'
          } else {
            'src-tauri/target/release/streamgrid.exe'
          }
          Copy-Item $exe -Destination dist/StreamGrid/StreamGrid.exe -Force

          # 3. Copiar instaladores gerados (NSIS / MSI), se presentes
          Get-ChildItem -Path src-tauri/target/release/bundle -Include *.exe, *.msi -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination dist/ -Force }

          # 4. Compactar o pacote portátil para distribuição
          Compress-Archive -Path dist/StreamGrid -DestinationPath dist/StreamGrid-Windows.zip -Force

          # 5. Gerar hash SHA-256 para todos os artefatos distribuíveis (.zip, .exe, .msi)
          $checksumLines = @()
          Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msi' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksumLines += "$hash  $($_.Name)"
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
          $checksumLines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Write-Host ($checksumLines -join "`n")

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        with:
          name: StreamGrid-Windows
          path: |
            dist/StreamGrid-Windows.zip
            dist/StreamGrid-Windows.zip.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Attest & Publish Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: StreamGrid-Windows
          path: dist

      - name: Collect Release Subjects for Attestation
        id: subjects
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(dist/*.zip dist/*.exe dist/*.msi)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Nenhum artefato encontrado em dist/" >&2
            exit 1
          fi
          {
            echo "list<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Artifact Attestation (Provenance via Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.subjects.outputs.list }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            dist/StreamGrid-Windows.zip
            dist/StreamGrid-Windows.zip.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
